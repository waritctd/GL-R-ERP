# Production-only overrides. Active when SPRING_PROFILES_ACTIVE=prod (set by render.yaml).
#
# Why this file exists: on Render's free/throttled instance a cold Spring context init is
# CPU-bound and can take ~20s+, pushing total startup past 60s. Render scans for an open
# HTTP port and fails the deploy ("Port scan timeout reached, no open ports detected") if the
# Tomcat connector hasn't started accepting connections in time. Tomcat only begins accepting
# at the very end of context refresh, AFTER every singleton bean is built — so the faster the
# context refreshes, the sooner the port opens.
spring:
  main:
    # Defer bean creation until first use so context refresh finishes (and the port opens)
    # much sooner. Flyway is force-eager via FlywayEagerInitConfig so schema migrations still
    # run before the app serves any traffic.
    lazy-initialization: true
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      # Don't pre-open idle connections during startup; each one round-trips to the Supabase
      # DB in Tokyo (~70-90ms). Connections are created on demand instead.
      minimum-idle: 0
      # Never block startup waiting on the pool to fill; surface DB errors on first use.
      initialization-fail-timeout: -1
  flyway:
    # Bounded retry so a momentarily-cold DB doesn't hang the migration step.
    connect-retries: 3
    connect-retries-interval: 5
    # This default is load-bearing for BOTH real production AND this showcase DB -- not just the
    # showcase, despite what an earlier version of this comment implied. Verified 2026-08-13 by
    # reading real prod's hr.flyway_schema_history directly (read-only): real production ALSO
    # has Flyway history drift, on three separate counts:
    #   - Checksum drift (a migration file edited after being applied): V12, V17, V21, V40, V41, V42
    #   - Applied in prod, not resolvable locally: V11 (the repo ships V11.1 / V11.2 instead)
    #   - Resolved locally, never applied, below prod's current max (V138): V11.1, V11.2
    # Flipping this to true would hard-fail the NEXT REAL-PROD DEPLOY on all three counts -- this
    # is not only the showcase's already-documented renumbering history. Re-enabling validation
    # requires an owner-approved `flyway repair` covering the 6 checksum mismatches, plus
    # resolving the V11-vs-V11.1/V11.2 split, before this default can safely become true. Until
    # that happens, it stays false everywhere the `prod` profile runs, real deploy or showcase.
    validate-on-migrate: ${APP_FLYWAY_VALIDATE_ON_MIGRATE:false}
    # This profile carries ONLY the real production schema (db/migration) — no demo seed.
    #
    # The `prod` profile is activated by BOTH the real GL&R production deploy AND the public
    # gl-r-erp.onrender.com showcase, so it must be safe for real production. The demo seed
    # (db/migration-demo: demo logins + sample tickets/leave/OT/commission) therefore lives in
    # the `demo` profile only (application-demo.yml). The showcase opts back into it explicitly
    # via SPRING_PROFILES_ACTIVE=prod,demo *plus* SPRING_FLYWAY_LOCATIONS in render.yaml, both of
    # which override this value; a deploy running `prod` alone gets no demo data.
    #
    # History: this line previously appended classpath:db/migration-demo, which meant a bare
    # `prod` deploy seeded the demo accounts into the real production DB (cleaned out 2026-07-24,
    # see docs/agent-handoffs/backups/prod-demo-data-snapshot-2026-07-24.json). The seed now runs
    # only where the `demo` profile / SPRING_FLYWAY_LOCATIONS is present.
    locations: classpath:db/migration
