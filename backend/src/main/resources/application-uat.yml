# UAT-only overrides. Active when SPRING_PROFILES_ACTIVE=uat (set by the gl-r-erp-uat Render service).
#
# Mirrors application-prod.yml (same Render cold-start rationale) but swaps the Flyway seed location:
# UAT applies db/migration-uat (synthetic, PII-free test data) instead of the demo seed. The two are
# mutually exclusive — a service is either prod (demo seed) or uat (UAT seed), never both.
#
# NOTE: Flyway validates version numbers across ALL configured locations combined. db/migration-uat
# files use the V900+ range to stay clear of the real db/migration V1..VNN range and its future
# additions. Check both directories before adding a UAT migration, or the uat-profile deploy fails at
# validate().
spring:
  main:
    lazy-initialization: true
  datasource:
    # UAT runs on the same Render starter plan against the same Supabase (Tokyo) region as prod, so it
    # needs the identical cold-start tuning (see application-prod.yml for the full rationale): don't
    # pre-open idle connections during startup, and never block startup waiting on the pool to fill.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      minimum-idle: 0
      initialization-fail-timeout: -1
  flyway:
    connect-retries: 3
    connect-retries-interval: 5
    locations: classpath:db/migration,classpath:db/migration-uat
    # The UAT DB already has db/migration-uat V900-V904 applied. main's newer real migrations
    # (V37-V39, from the post-quotation sales flow merge) land BELOW that version, so on the next
    # deploy Flyway would see them as "new migrations below the current schema version" and fail
    # validate() with default out-of-order=false. Safe here because V37-V39 are purely additive
    # (V37 adds unit_basis NOT NULL DEFAULT 'PIECE' with a backfill; V38/V39 add nullable columns)
    # and V903's seed data predates and never references these columns (grepped clean). On a fresh
    # DB migrations still apply in numeric order (V1..V39 then V900..V904); only an already-seeded
    # UAT DB takes the out-of-order path.
    out-of-order: true

# Email transport — UAT sends over REAL authenticated SMTP (SmtpMailer) rather than the Resend HTTP
# API it used to run on, so staging exercises the same transport an on-prem install will.
#
# Only the two values that actually DIFFER from application.yml are set here. Everything else
# (from, override-to, subject-prefix, smtp.port/username/password/starttls) is ALREADY declared in
# application.yml bound to its own APP_MAIL_* env var, so re-declaring it here would be a silent
# duplicate that drifts — set those on the Render dashboard, not in this file.
#
# ⚠️ APP_MAIL_FROM must be set on the dashboard to the authenticated SMTP account. Gmail rewrites or
# rejects a From the account does not own, and application.yml's default is Resend's sandbox sender
# (onboarding@resend.dev) — wrong for any SMTP deployment. Deliberately NOT defaulted here: this
# file is loaded whenever the uat profile is active, including while provider is still `resend`, so
# a from: default here would break Resend sends (unverified domain -> 403) on the next code push,
# before anyone touches the dashboard.
#
# ⚠️ RENDER EGRESS: gl-r-erp-uat runs on Render (plan: starter), where outbound SMTP was previously
# observed to fail (MailConnectException/timeout to smtp.gmail.com:587) — the original reason this
# stack went to Resend at all. If sends time out, that block is the cause, not this config: try
# APP_MAIL_SMTP_PORT=465 with APP_MAIL_SMTP_STARTTLS=false, else use a relay on a non-blocked port,
# or set APP_MAIL_PROVIDER=resend to roll back. Nothing in this file can work around it.
#
# ⚠️ APP_MAIL_OVERRIDE_TO redirects NOTIFICATION mail to one test inbox, but FactoryEmailService
# does NOT honour it — factory-quote mail goes to sales.factory_config.email as stored. V911 seeds
# those @uat.glr so nothing escapes; keep it that way. An unverified Resend account was a second
# containment layer, and real SMTP removes it.
app:
  mail:
    # `smtp` selects SmtpMailer. NOTE: this default applies only when APP_MAIL_PROVIDER is UNSET —
    # the Render dashboard still carries APP_MAIL_PROVIDER=resend from the old transport, and a
    # dashboard value wins, so it must be changed to `smtp` there or this switch does nothing.
    provider: ${APP_MAIL_PROVIDER:smtp}
    smtp:
      # application.yml defaults this to empty, so SmtpMailer refuses to start on a blank host —
      # that guard is what stops a mis-set on-prem deploy from silently sending nowhere. UAT's
      # relay is Gmail.
      host: ${APP_MAIL_SMTP_HOST:smtp.gmail.com}
