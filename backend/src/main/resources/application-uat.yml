# UAT-only overrides. Active when SPRING_PROFILES_ACTIVE=uat (set by the gl-r-erp-uat Render service).
#
# Mirrors application-prod.yml (same Render cold-start rationale) but swaps the Flyway seed location:
# UAT applies db/migration-uat (synthetic, PII-free test data) instead of the demo seed. The two are
# mutually exclusive — a service is either prod (demo seed) or uat (UAT seed), never both.
#
# NOTE: Flyway validates version numbers across ALL configured locations combined. db/migration-uat
# files use the V900+ range to stay clear of the real db/migration V1..VNN range and its future
# additions. Check both directories before adding a UAT migration, or the uat-profile deploy fails at
# validate().
spring:
  main:
    lazy-initialization: true
  datasource:
    # UAT runs on the same Render starter plan against the same Supabase (Tokyo) region as prod, so it
    # needs the identical cold-start tuning (see application-prod.yml for the full rationale): don't
    # pre-open idle connections during startup, and never block startup waiting on the pool to fill.
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    hikari:
      minimum-idle: 0
      initialization-fail-timeout: -1
  flyway:
    connect-retries: 3
    connect-retries-interval: 5
    locations: classpath:db/migration,classpath:db/migration-uat
    # The UAT DB already has db/migration-uat V900-V904 applied. main's newer real migrations
    # (V37-V39, from the post-quotation sales flow merge) land BELOW that version, so on the next
    # deploy Flyway would see them as "new migrations below the current schema version" and fail
    # validate() with default out-of-order=false. Safe here because V37-V39 are purely additive
    # (V37 adds unit_basis NOT NULL DEFAULT 'PIECE' with a backfill; V38/V39 add nullable columns)
    # and V903's seed data predates and never references these columns (grepped clean). On a fresh
    # DB migrations still apply in numeric order (V1..V39 then V900..V904); only an already-seeded
    # UAT DB takes the out-of-order path.
    out-of-order: true

# Email transport — UAT sends via the Resend HTTP API (ResendMailer), NOT SMTP.
#
# ⛔ DO NOT switch this to `smtp`. Render blocks outbound SMTP from this service, and it has now been
# confirmed live TWICE — most recently 2026-08-02 on plan `starter` with real Gmail credentials:
#
#     MailConnectException: Couldn't connect to host, port: smtp.gmail.com, 587; timeout -1
#     java.net.ConnectException: Connection timed out
#
# That is a TCP connect timeout, not an auth failure: the socket never opens, so credentials are
# never reached and no username/password/App Password can fix it. Ports 25, 465 and 587 are all
# blocked, and Gmail offers no other submission port (no 2525), so there is no port to fall back to
# — Gmail-over-SMTP from Render is not achievable by configuration. The alternatives, if this ever
# needs revisiting: an SMTP relay that offers port 2525 (Brevo/SendGrid/Mailgun), the Gmail API over
# HTTPS on 443 (needs OAuth2 and a new Mailer implementation), or moving the service off Render.
#
# This restriction is specific to the HOST, not to SmtpMailer, which is verified working (a local
# Mailpit run captured a correct From/To/subject over a real SMTP conversation). The on-prem
# deployment uses provider=smtp and is unaffected by any of the above.
#
# Pinning `resend` here rather than relying solely on the Render dashboard is deliberate: the
# repo-wide default in application.yml is `log`, so a dashboard value that is deleted or mistyped
# would silently downgrade UAT to sending nothing while every log line still reads "email sent".
#
# app.mail.from is set via APP_MAIL_FROM on the Render dashboard (see render.yaml's gl-r-erp-uat
# service - sync:false, so it is a dashboard secret, not provisioned by that file), NOT here.
# glr-trial.lat is verified in Resend and the live From: header uses an address on that domain
# (confirmed against a real received email, 2026-08-08) - the domain was registered 2026-08-05,
# three days before that confirmation. If APP_MAIL_FROM is ever unset on the dashboard,
# application.yml's onboarding@resend.dev sandbox-sender default applies instead; that fallback can
# only send TO the Resend account's own address, which is why APP_MAIL_OVERRIDE_TO below exists as
# a safety net regardless of which From is active.
#
# ⚠️ APP_MAIL_OVERRIDE_TO redirects NOTIFICATION mail to one test inbox, but FactoryEmailService
# does NOT honour it — factory-quote mail goes to sales.factory_config.email as stored. V911 seeds
# those @uat.glr so nothing escapes; keep it that way.
app:
  mail:
    provider: ${APP_MAIL_PROVIDER:resend}
    # Appended (not prepended) to every UAT-sent subject so a real inbox (APP_MAIL_OVERRIDE_TO)
    # never confuses a test email for a real one, without putting a bracketed keyword at the FRONT
    # of the subject - a leading "[TEST]"-shaped token is a classic spam-filter trigger, and this
    # domain has no sending reputation to spend on avoidable ones. Leading space is deliberate -
    # YAML-quoted so it survives (an unquoted flow scalar trims leading/trailing whitespace), giving
    # "Subject (UAT)" rather than "Subject(UAT)".
    subject-suffix: "${APP_MAIL_SUBJECT_SUFFIX: (UAT)}"
    # Same UAT frontend URL NotificationEmailService already defaults to - set explicitly here so a
    # UAT deploy doesn't rely on that Java-side default matching. Used for portal CTA links only.
    app-base-url: ${APP_MAIL_APP_BASE_URL:https://demo-glr-git-uat-waritctds-projects.vercel.app}
