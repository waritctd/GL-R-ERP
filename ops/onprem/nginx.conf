# Served only to cloudflared (the port is bound to 127.0.0.1 on the host). The browser talks to
# Vercel (the frontend), and Vercel's /api rewrite calls this host, so CF-Connecting-IP is a Vercel
# address, not the user. Vercel sets X-Forwarded-For to the real client and Cloudflare appends to
# it, so the header is passed through unchanged: LoginRateLimitFilter keys on its FIRST entry, the
# same as it did behind Vercel + Render. A caller that skips Vercel can still choose that entry,
# which is why the filter also limits per account.

# Hashed bundles cache forever; index.html (and SPA fallbacks) always revalidate; the API sets its own.
map $uri $glr_cache_control {
    ~^/assets/ "public, max-age=31536000, immutable";
    ~^/api/    "";
    default    "no-cache";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    client_max_body_size 25m;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Same headers Vercel set (vercel.json), minus the vercel.live sources. No location below
    # uses add_header, so every location inherits these.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Cache-Control $glr_cache_control; # no "always": a 404 must not be cached as immutable

    # Docker's DNS, re-asked every 10s, so a recreated backend container (new IP) is found again.
    resolver 127.0.0.11 valid=10s;

    location /api/ {
        # A variable makes nginx resolve at request time. With no URI part in the variable, the
        # original request URI (/api/...) is passed unchanged.
        set $glr_backend http://backend:8080;
        proxy_pass $glr_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }

    # A missing hashed bundle is a 404, not index.html cached as immutable.
    location /assets/ {
        try_files $uri =404;
    }

    location / {
        try_files $uri /index.html;
    }
}
