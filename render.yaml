# Render Blueprint for the GL&R HR Spring Boot backend.
# Import via Render Dashboard -> New -> Blueprint, pointing at this repo.
# The service name is pinned so the public URL is deterministic:
#   https://gl-r-erp.onrender.com
# which is what the Vercel frontend proxies /api to (see frontend/vercel.json).
#
# ── BUILDS FROM SOURCE. THE FONT CAVEAT IS REAL AND UNRESOLVED (#666) ────────────────────
# #670 switched this service to `runtime: image` so the licensed Thai fonts could be baked in
# where they exist. Reverted here under a UAT phase-1 deadline: the image URL was a placeholder,
# so every deploy would have failed, and building+pushing an image needs Docker and the licensed
# font files. Deployability today beat font fidelity today — an explicit owner call, not a
# retraction of the finding.
#
# WHAT THAT MEANS, PLAINLY: `backend/fonts/` is always empty in a fresh clone, so this service
# renders customer-facing quotations and deposit notices in SUBSTITUTE fonts — wider glyphs,
# header text overflowing the certification badges. That is the status quo of the last several
# months, not a regression introduced here.
#
# The build no longer fails on an empty fonts/ (see backend/Dockerfile) so this path works, but
# the substitution guard added by #670 is kept: if fonts ARE supplied and fontconfig substitutes
# one anyway, the build still fails loudly.
#
# To finish #666 properly, restore `runtime: image` with a real image.url and use
# scripts/build-push-backend-image.sh, which is left in place and working.
services:
  - type: web
    name: gl-r-erp
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore          # closest Render region to the Supabase ap-northeast-1 DB
    plan: starter              # free tier is CPU-throttled (slow startup races the port scan) and cold-starts; starter avoids both
    # Owner ruling 2026-08-03: auto-deploy off. This is UAT sitting on the same DB as HR/sales
    # data people actually rely on -- a push to main should not roll out until someone chooses to
    # deploy it. Trigger deploys manually from the Render dashboard (or `render deploys create`).
    autoDeploy: false
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      # The hosted Render service uses a database that already has demo migrations
      # in flyway_schema_history. Keep the location explicit so deploys still
      # resolve V21/V32 even if dashboard profile settings drift.
      - key: SPRING_FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/migration-demo
      - key: APP_FLYWAY_ENABLED
        value: "true"
      # Explicit rather than relying on application-prod.yml's default -- real production (not
      # just this showcase) has Flyway history drift too; see that file's comment on
      # validate-on-migrate for the specific versions and what re-enabling would require.
      - key: APP_FLYWAY_VALIDATE_ON_MIGRATE
        value: "false"
      # Frontend origin is only needed as a CORS fallback; the Vercel proxy keeps calls
      # same-origin so CORS normally isn't exercised.
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Secrets — set these in the Render dashboard (sync:false keeps them out of git).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_ATTENDANCE_AGENT_TOKEN
        sync: false
      - key: APP_UPLOADS_DIR
        sync: false
      # BOT issues a separate key per API, and BOT's rate limit is 100 calls/hour PER TOKEN -- so
      # BotFxFetchService (app.bot.fx-api-token) and BotHolidayFetchService
      # (app.bot.holiday-api-token) each need their own key, with no fallback between them. Neither
      # was previously declared here, so both fetchers have been silently no-op'ing in this
      # environment -- each property defaults to blank and its service logs a WARN/INFO and returns
      # rather than throwing, so there is no error, only an unset value and a quiet skip.
      - key: BOT_FX_API_TOKEN
        sync: false
      - key: BOT_HOLIDAY_API_TOKEN
        sync: false
      # Notification email. Exactly the same omission as the BOT tokens above, with the same
      # symptom: spring.mail.username/password default to BLANK in application.yml, neither was
      # declared here, and NotificationEmailService#send catches every exception and only logs —
      # so with mail.smtp.auth=true and no credentials, every notification email failed silently.
      # Reported by the owner: an OT notification never arrived. The employee row and the whole
      # app-side path were fine; the credentials were simply never set on this service.
      #
      # ⚠️ Gmail will NOT accept an account password here. Create a 16-character App Password
      # (Google Account → Security → 2-Step Verification → App passwords) and use that as
      # MAIL_PASSWORD. MAIL_USERNAME doubles as the From address (NotificationEmailService's
      # fromAddress falls back to spring.mail.username), so it must be a real sendable mailbox.
      - key: MAIL_HOST
        sync: false
      - key: MAIL_PORT
        sync: false
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
