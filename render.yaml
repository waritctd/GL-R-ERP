# Render Blueprint for the GL&R HR Spring Boot backend.
# Import via Render Dashboard -> New -> Blueprint, pointing at this repo.
# The service name is pinned so the public URL is deterministic:
#   https://gl-r-erp.onrender.com
# which is what the Vercel frontend proxies /api to (see frontend/vercel.json).
services:
  - type: web
    name: gl-r-erp
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore          # closest Render region to the Supabase ap-northeast-1 DB
    plan: starter              # free tier is CPU-throttled (slow startup races the port scan) and cold-starts; starter avoids both
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod,demo
      # The hosted Render service uses a database that already has demo migrations
      # in flyway_schema_history. Keep the location explicit so deploys still
      # resolve V21/V32 even if dashboard profile settings drift.
      - key: SPRING_FLYWAY_LOCATIONS
        value: classpath:db/migration,classpath:db/migration-demo
      - key: APP_FLYWAY_ENABLED
        value: "true"
      # Frontend origin is only needed as a CORS fallback; the Vercel proxy keeps calls
      # same-origin so CORS normally isn't exercised.
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
      # Secrets — set these in the Render dashboard (sync:false keeps them out of git).
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_ATTENDANCE_AGENT_TOKEN
        sync: false
      - key: APP_UPLOADS_DIR
        sync: false
      # BOT issues a separate key per API, and BOT's rate limit is 100 calls/hour PER TOKEN -- so
      # BotFxFetchService (app.bot.fx-api-token) and BotHolidayFetchService
      # (app.bot.holiday-api-token) each need their own key, with no fallback between them. Neither
      # was previously declared here, so both fetchers have been silently no-op'ing in this
      # environment -- each property defaults to blank and its service logs a WARN/INFO and returns
      # rather than throwing, so there is no error, only an unset value and a quiet skip.
      - key: BOT_FX_API_TOKEN
        sync: false
      - key: BOT_HOLIDAY_API_TOKEN
        sync: false

  # Dedicated UAT stack — separate service, separate DB, auto-deploys from the `uat`
  # integration branch. Backlog features merge to `uat` for stakeholder acceptance
  # testing, then promote to main. The ONLY functional difference from gl-r-erp is the
  # `uat` Spring profile, which applies db/migration-uat (synthetic, PII-free seed) instead
  # of the demo seed. Point SPRING_DATASOURCE_* at a NEW UAT-only Supabase project — never
  # the demo DB and never a real-prod DB (a UAT payroll run bank-exports the seeded fake
  # account numbers, which must stay isolated).
  - type: web
    name: gl-r-erp-uat
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    region: singapore
    plan: starter
    branch: uat                # auto-deploy from the UAT integration branch
    autoDeploy: true
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: uat             # pinned in git (reviewable); a stray `prod` would seed demo data / wrong DB
      - key: APP_FLYWAY_ENABLED
        value: "true"
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false            # set to the UAT Vercel origin in the dashboard
      # Test-only: redirect every notification email to one real inbox (regardless of the seeded
      # employee's actual/fake address) so the email pipeline can be verified end-to-end. Blank on
      # gl-r-erp (demo/prod) above, so this has zero effect there. See NotificationEmailService.
      - key: APP_MAIL_OVERRIDE_TO
        value: fasaiglrhr@gmail.com
      - key: APP_MAIL_SUBJECT_PREFIX
        value: "[UAT TEST] "
      # Secrets — set in the Render dashboard, pointing at the NEW UAT Supabase project only.
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: APP_ATTENDANCE_AGENT_TOKEN
        sync: false
      # Email transport = real authenticated SMTP (SmtpMailer), replacing the Resend HTTP API this
      # stack used to run on. NOTE: the gl-r-erp (demo) service above sets no mail vars at all, so
      # it stays on application.yml's `log` default — this is a UAT-only transport, not prod parity.
      #
      # ⚠️ Render was previously observed to block outbound SMTP (25/465/587) on free/starter web
      # services — MailConnectException/timeout to smtp.gmail.com:587 — which is why this was on
      # Resend in the first place. If sends time out after this deploy, that egress block is the
      # cause, not the config: try APP_MAIL_SMTP_PORT=465 + APP_MAIL_SMTP_STARTTLS=false, and
      # failing that use a relay on a non-blocked port or revert APP_MAIL_PROVIDER to `resend`.
      #
      # ⚠️ Render does NOT apply changed `value:` env vars from a plain code push, and IGNORES
      # `sync: false` keys entirely on a blueprint update — so every key in this block is
      # documentation of what an operator must set by hand on the dashboard, not provisioning.
      # APP_MAIL_PROVIDER in particular still reads `resend` there and must be flipped to `smtp`
      # (or deleted, letting application-uat.yml's `smtp` default apply), or nothing changes.
      - key: APP_MAIL_PROVIDER
        value: smtp
      # Credentials for the sending mailbox. Gmail requires an App Password (2-Step Verification
      # on the account); its ordinary password is rejected with 535.
      - key: APP_MAIL_SMTP_USERNAME
        sync: false
      - key: APP_MAIL_SMTP_PASSWORD
        sync: false
      # REQUIRED, not optional: application.yml defaults app.mail.from to Resend's sandbox sender
      # (onboarding@resend.dev), which Gmail will rewrite or reject because the authenticated
      # account does not own it. Set this to the APP_MAIL_SMTP_USERNAME address.
      - key: APP_MAIL_FROM
        sync: false
      # APP_MAIL_SMTP_PORT/STARTTLS are left to application.yml's 587 + STARTTLS defaults.
      - key: APP_UPLOADS_DIR
        sync: false
