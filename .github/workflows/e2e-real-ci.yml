name: E2E (Playwright, real backend)

# Browser + API e2e against the REAL stack — Vite dev server → Spring Boot → Postgres.
# This is the only suite that asks the real Java services anything, so it is the only one whose
# result is evidence about permissions (see frontend/e2e-real/README.md).
#
# The `e2e-ci.yml` this comment used to name was DELETED by #592, along with the whole mock e2e
# suite. Its replacement is not a like-for-like: `visual-ci.yml` drives the mock frontend purely
# to pixel-diff the rendered output, and asserts nothing about behaviour or authorization.
# The two answer different questions — "does the real backend still honour this?" versus "did
# the pixels move?" — and neither substitutes for the other.
#
# NON-GATING: intentionally not a required check yet. Promote once proven stable across a few
# PR cycles. This workflow is now STRUCTURALLY READY for that promotion — see below — but
# making it required is a branch-protection setting, deliberately left to the owner.
#
# Triggered by backend changes too, not just frontend ones — unlike the mock suite, this one
# can actually break when a Java role gate or a migration moves, which is the point of it.
#
# ── WHY THERE IS NO `paths:` FILTER ON THE TRIGGERS ──────────────────────────────────────
# There used to be one, on `frontend/**` + `backend/**`. A trigger-level filter makes the
# `e2e-real` check ABSENT — not skipped, absent — on any PR that misses those paths, and
# GitHub waits forever on a required check that never reports. Proof from this repo: PR #617
# was workflow-only, and `e2e-real` and `lint-and-build` never reported at all, while
# `build-and-test`, `dependency-review` and `visual` did. Requiring this job as it stood
# would have deadlocked every such PR.
#
# The filter therefore lives INSIDE the job now (see "Detect relevant changes"), the same
# shape `backend-ci.yml` uses for #435 and `visual-ci.yml` uses for its own required check.
# The job always reports; the expensive work is gated on the diff. Do not "tidy this up" by
# reintroducing a `paths:` key.
#
# One cost worth knowing: `services:` containers start before the first step runs, so the
# Postgres service spins up even on a run that then skips everything. That is a few seconds
# and cannot be conditioned away — a job's services are not step-gated.

on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated rather than inherited. The repo default is already read-only, but a
# default is a setting someone can change from a web UI; this pins it in the file. Nothing here
# writes to the repo — and `actions/upload-artifact` needs no extra scope, as visual-ci.yml has
# been demonstrating under the same `contents: read` since #616.
permissions:
  contents: read

# A newer push to the same PR makes an in-flight run pointless — it is validating a commit
# nobody will merge. Cancel superseded PR runs; do NOT cancel pushes to main, because a
# cancelled run leaves that commit on main with no verdict at all, which is the opposite of
# what these checks are for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-real:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: hris
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # The backend fails fast on an unreachable datasource, so gate the whole job on the DB
        # actually accepting connections rather than merely having been created.
        options: >-
          --health-cmd "pg_isready -U postgres -d hris"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    steps:
      # fetch-depth: 0 so the base commit is present for the diff below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Replaces the old trigger-level `paths:` filter. Fails SAFE: if the base commit cannot be
      # resolved (force-push, new branch, shallow history) we run the whole suite rather than
      # report a green check we have not earned.
      - name: Detect relevant changes
        id: changes
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base commit unresolvable ('$BASE') — running the full e2e suite."
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Two-dot: on a pull_request HEAD is the merge commit, so `BASE HEAD` is exactly the
          # PR's net effect on the base branch. On a push it is the pushed range.
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(frontend/|backend/|\.github/workflows/e2e-real-ci\.yml$)'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No frontend or backend changes — nothing to exercise
        if: steps.changes.outputs.relevant != 'true'
        run: echo "::notice::No frontend/** or backend/** changes in this diff; skipping the real-backend e2e run."

      - name: Set up Java 21
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-java@dd06d9cba3e5552c54d9f8ea23572deb30010f7c # v6.0.0
        with:
          java-version: '21'
          distribution: temurin
          cache: maven

      - name: Set up Node.js 22
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build backend jar
        if: steps.changes.outputs.relevant == 'true'
        working-directory: backend
        # Tests are skipped on purpose: backend-ci.yml already runs them, and this job's
        # subject is the running service, not its unit suite.
        run: ./mvnw -B -DskipTests package

      - name: Install frontend dependencies
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm ci

      - name: Get installed Playwright version
        if: steps.changes.outputs.relevant == 'true'
        id: playwright-version
        working-directory: frontend
        run: echo "version=$(node -e "console.log(require('./package-lock.json').packages['node_modules/@playwright/test'].version)")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        if: steps.changes.outputs.relevant == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright chromium (+ OS deps)
        if: steps.changes.outputs.relevant == 'true' && steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Install Playwright OS deps only (browser cache hit)
        if: steps.changes.outputs.relevant == 'true' && steps.playwright-cache.outputs.cache-hit == 'true'
        working-directory: frontend
        run: npx playwright install-deps chromium

      - name: Start backend (demo seed profile)
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        # Flyway applies db/migration + db/migration-demo on boot under SPRING_PROFILES_ACTIVE=demo,
        # which is what creates the login accounts this suite drives. The script also sets the
        # CORS origin for the suite's dev-server port — without it every login 403s.
        # Backgrounded with stdout/stderr redirected to a file: without the redirect the step
        # would hold the runner's stdout open and never finish. The job tears the process down
        # when it ends, so there is no explicit stop step.
        run: node scripts/start-e2e-backend.mjs > "$RUNNER_TEMP/backend.log" 2>&1 &

      - name: Wait for backend to be healthy
        if: steps.changes.outputs.relevant == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:8080/actuator/health; then
              echo "backend healthy after ${i} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "::error::backend did not become healthy within 5 minutes"
          cat "$RUNNER_TEMP/backend.log"
          exit 1

      - name: Run real-backend e2e
        if: steps.changes.outputs.relevant == 'true'
        working-directory: frontend
        run: npm run test:e2e

      # Also gated: if the detect step itself fails, `failure()` fires while no backend was ever
      # started, and `cat` on a missing log would pile a second, misleading red on top of the real one.
      - name: Backend log (on failure)
        if: failure() && steps.changes.outputs.relevant == 'true'
        run: cat "$RUNNER_TEMP/backend.log"

      # if-no-files-found: ignore — with the suite skipped there is no report directory, and the
      # default (`warn`) would print a spurious warning on every docs-only PR.
      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report-real
          path: frontend/playwright-report-real/
          retention-days: 14
          if-no-files-found: ignore
