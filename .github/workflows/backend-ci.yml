name: Backend CI

# The `paths:` filter used to live here, on the triggers. That made `build-and-test`
# *absent* — not skipped, absent — on any PR that touched no `backend/**` file, and GitHub
# treats a required check that never reports as permanently pending. So the check could not
# be made required without deadlocking every frontend-only PR (issue #435).
#
# The filter therefore now lives INSIDE the job: the workflow runs on every PR, the
# `build-and-test` check always reports, and the expensive steps are gated on whether the
# diff actually touched the backend. A frontend-only PR reports green in seconds; a backend
# PR still runs the full `./mvnw -B clean verify` and still goes red when it fails.
on:
  push:
    branches: [main]
  pull_request:

# Least privilege, stated rather than inherited. The repo default is already read-only, but a
# default is a setting someone can change from a web UI; this pins it in the file. Nothing in
# this workflow writes to the repo.
permissions:
  contents: read

# A newer push to the same PR makes an in-flight run pointless — it is validating a commit
# nobody will merge. Cancel superseded PR runs; do NOT cancel pushes to main, because a
# cancelled run leaves that commit on main with no verdict at all, which is the opposite of
# what these checks are for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      # fetch-depth: 0 so the base commit is present for the diff below. The pack is ~45 MiB,
      # so a full fetch costs seconds — cheaper than getting the shallow-fetch dance wrong.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Replaces the old trigger-level `paths:` filter. Fails SAFE: if the base commit cannot
      # be resolved (force-push, new branch, shallow history), we run the full suite rather
      # than reporting a green check we have not earned.
      - name: Detect backend changes
        id: changes
        # Pinned to the repo root, overriding this job's `working-directory: backend`. git
        # prints repo-relative paths regardless of cwd today, but if that ever changed the
        # `^backend/` match would silently stop matching — i.e. it would fail GREEN. Pin it.
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base commit unresolvable ('$BASE') — running the full backend suite."
            echo "backend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Two-dot: on a pull_request, HEAD is the PR merge commit, so `BASE HEAD` is exactly
          # the PR's net effect on the base branch. On a push it is the pushed range.
          CHANGED="$(git diff --name-only "$BASE" HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -qE '^(backend/|\.github/workflows/backend-ci\.yml$)'; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: No backend changes — nothing to build
        if: steps.changes.outputs.backend != 'true'
        run: echo "No backend/** changes in this diff; skipping the Maven build."

      # Owner ruling 2026-08-14: Docker is ENABLED for this job, and its absence is a stated
      # failure rather than something the suite quietly degrades around.
      #
      # Why a step and not just a test: the ~130 DB-backed classes (every real-DB authz proof
      # CLAUDE.md requires, and DealStageCheckConstraintIntegrationTest's Java<->Postgres constraint
      # mirrors) are worth nothing if they do not execute. This is the earliest point at which that
      # precondition can be checked, it costs ~1s, and it fails with a sentence instead of ~130
      # Testcontainers stack traces six minutes in. It runs BEFORE the JDK and LibreOffice setup
      # deliberately — there is no reason to provision a build that cannot produce a real verdict.
      #
      # Mirrors PostgresTestSupport.isAvailable()'s own resolution order: an external TEST_DB_URL
      # satisfies the requirement without Docker, exactly as it does for the suite. Its Java-side
      # counterpart, IntegrationDatabaseRequiredInCiTest, is NOT redundant with this: `docker info`
      # is what the shell can see, while that test asks DockerClientFactory — the component that
      # actually decides, and which additionally honours DOCKER_HOST, ~/.testcontainers.properties
      # and its own strategy chain. The two can disagree, and that disagreement fails green.
      - name: Require an integration database (Docker, or TEST_DB_URL)
        if: steps.changes.outputs.backend == 'true'
        run: |
          set -euo pipefail

          if [ -n "${TEST_DB_URL:-}" ]; then
            echo "TEST_DB_URL is set — the integration suite will use that external database."
            exit 0
          fi

          if ! docker info >/dev/null 2>&1; then
            echo "::error title=No integration database::This runner has no reachable Docker \
          daemon and no TEST_DB_URL, so every DB-backed test would fail or be meaningless. A \
          backend build without one cannot produce a verdict on the Java<->Postgres constraint \
          mirrors or on any role-scope filter. Restore Docker on the runner, or set TEST_DB_URL. \
          Do not work around this by removing this step."
            exit 1
          fi

          # Informational only — `|| true` so a hiccup printing the version can never fail a step
          # whose actual assertion (the `docker info` probe above) has already passed. A false red
          # here would be worse than useless: it would teach people to delete the step.
          echo "Docker daemon reachable; Testcontainers will provide Postgres."
          docker version --format 'server {{.Server.Version}}' || true

      - name: Set up Temurin JDK 21
        if: steps.changes.outputs.backend == 'true'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # LibreOffice Calc is required by the quotation/deposit PDF renderer tests, which convert the
      # real .xls templates to PDF by shelling out to `soffice --headless`. Without it those tests
      # self-skip (Assumptions.assumeTrue on LibreOfficePdfConverter.isAvailable), so install it here
      # to actually exercise the document-generation path. Mirrors backend/Dockerfile's Render setup.
      - name: Install LibreOffice (for PDF renderer tests)
        if: steps.changes.outputs.backend == 'true'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libreoffice-calc

      # Testcontainers spins its own throwaway Postgres via the runner's Docker daemon, so the
      # integration + security + Flyway tests run without a manually provisioned DB service. The
      # TEST_DB_URL override path still exists in PostgresTestSupport as a one-line revert if needed.
      - name: Build and test
        if: steps.changes.outputs.backend == 'true'
        run: ./mvnw -B clean verify
