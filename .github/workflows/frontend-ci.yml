name: Frontend CI

# ── WHY THERE IS NO `paths:` FILTER ON THE TRIGGERS ──────────────────────────────────────
# There used to be one, on `frontend/**`. A trigger-level filter makes `lint-and-build`
# ABSENT — not skipped, absent — on any PR that misses those paths, and GitHub waits forever
# on a required check that never reports. Proof from this repo: PR #617 was workflow-only,
# and `lint-and-build` and `e2e-real` never reported at all, while `build-and-test`,
# `dependency-review` and `visual` did. Requiring this job as it stood would have deadlocked
# every backend-only, docs-only and workflow-only PR.
#
# The filter therefore lives INSIDE the job now, the same shape `backend-ci.yml` uses for
# #435 and `visual-ci.yml` uses for its own required check: the job always reports, and the
# expensive steps are gated on whether the diff actually touched the frontend. Do not "tidy
# this up" by reintroducing a `paths:` key.
#
# Neither job here is a required check yet — that is a branch-protection setting, left to the
# owner. This workflow is merely structurally ready for the promotion.
#
# ── SELECTIVE TESTS ON PULL REQUESTS (2026-10-01) ─────────────────────────────────────────
# Lint and build always run when the frontend is touched. The Vitest step, though, no longer
# always runs all ~2,700 tests on a PR. `.github/scripts/select-tests.mjs` picks a mode:
#   full     — package.json / package-lock.json / vite or vitest config / src/test/** (setup
#              and fixtures) / .env* / this workflow / the picker itself changed, OR any file
#              under frontend/ that is not .js/.jsx/.ts/.tsx/.json changed (CSS, HTML, assets:
#              a dozen tests read those through fs, which the import graph cannot see), OR the
#              PR carries the `full-ci` label, OR the PR targets `main` (merging to main
#              deploys — owner ruling 2026-10-01), OR the base commit is unresolvable, OR the
#              picker printed anything but a known mode → `npm test`.
#   changed  — code-only diff → `vitest run --changed <base>` (tests whose import graph reaches
#              a changed file) PLUS a second invocation for the tests that read source via fs,
#              and src/api/serverContract.test.js whenever docs/api/** or a *Controller.java
#              changed, and every fs-reading test that PARSES a changed backend Java file
#              (stageCatalog.test.js reads DealStage.java, and so on). Two invocations because
#              a positional file filter RESTRICTS `--changed` rather than adding to it
#              (verified against vitest 4.1, 2026-10-01).
#   none     — nothing frontend-relevant changed.
#
# THE SAFETY NET: pushes to `develop` and `main` always run `npm test` in full, so a PR whose
# selection missed a test is caught on the merge to develop. The picker is unit-tested
# (select-tests.test.mjs) and fails SAFE to `mode=full` on any error. Add the `full-ci` label
# to force the full run on a PR.
#
# `types:` lists the default three PLUS `labeled`, so adding `full-ci` to an open PR starts a
# new run immediately; the concurrency group below cancels the in-flight selective run for the
# same PR, which is the intended effect.

on:
  push:
    branches: [main, develop]
  pull_request:
    types: [opened, synchronize, reopened, labeled]

# Least privilege, stated rather than inherited. The repo default is already read-only, but a
# default is a setting someone can change from a web UI; this pins it in the file. Nothing in
# this workflow writes to the repo.
permissions:
  contents: read

# A newer push to the same PR makes an in-flight run pointless — it is validating a commit
# nobody will merge. Cancel superseded PR runs; do NOT cancel pushes to main, because a
# cancelled run leaves that commit on main with no verdict at all, which is the opposite of
# what these checks are for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ── THE AUDIT IS ITS OWN JOB, AND IT IS NOT GATED ON THE DIFF ────────────────────────────
  # It used to be the FIRST step of lint-and-build, ahead of lint/test/build in the same job.
  # That made a red audit mean the suite NEVER RAN — no lint, no vitest, no build — while the
  # check reported a single generic red. Combined with lint-and-build not being a required
  # check, a PR could merge having run neither the audit nor a single test. Splitting them
  # means an advisory can never again suppress the test suite, and the two produce distinct,
  # separately promotable checks that run in parallel.
  #
  # Deliberately NOT gated on "did the frontend change": an advisory's range is published
  # UPSTREAM and mutable, so the dependency tree can start failing on a day nobody touched
  # frontend/. Gating it on the diff would mean a newly-published advisory lies undetected
  # until the next frontend PR. `dependency-review` is already un-gated for the same reason;
  # note the two are complementary, not redundant — that one inspects deps the PR's diff
  # ADDS, this one re-audits the whole installed tree.
  #
  # ⚠️ Consequence to be aware of: a frontend advisory can now turn a backend-only or
  # docs-only PR red. That is intended — it is a real problem with the repo either way — but
  # it is a behaviour change from the path-filtered version.
  audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same threshold and scope as `npm audit --audit-level=moderate`, minus the
      # advisories reviewed in frontend/audit-allowlist.json. Each exception carries a
      # reachability argument and a hard reviewBy date, so unfixable-but-unreachable
      # advisories cannot quietly become permanent. Anything new still fails here.
      - name: Audit dependencies
        run: npm run audit

  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      # fetch-depth: 0 so the base commit is present for the diff below.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Replaces the old trigger-level `paths:` filter. Fails SAFE: if the base commit cannot
      # be resolved (force-push, new branch, shallow history) we run the full suite rather
      # than report a green check we have not earned.
      - name: Detect frontend changes
        id: changes
        # Pinned to the repo root, overriding this job's `working-directory: frontend`. git
        # prints repo-relative paths regardless of cwd today, but if that ever changed the
        # `^frontend/` match would silently stop matching — i.e. it would fail GREEN. Pin it.
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            BASE="$PR_BASE_SHA"
          else
            BASE="$PUSH_BEFORE_SHA"
          fi

          if [ -z "$BASE" ] \
            || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "Base commit unresolvable ('$BASE') — running the full frontend suite."
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Two-dot: on a pull_request HEAD is the merge commit, so `BASE HEAD` is exactly the
          # PR's net effect on the base branch. On a push it is the pushed range.
          # --no-renames so a move OUT of a sensitive directory (config/, common/, resources/)
          # lists the source path as a delete, not a rename that hides it; quotePath=false so
          # a non-ASCII path is printed as-is rather than octal-escaped.
          CHANGED="$(git -c core.quotePath=false diff --no-renames --name-only "$BASE" HEAD)"
          echo "Changed files:"
          echo "$CHANGED"

          # Backend paths are in scope even though they are not frontend files, because
          # src/api/serverContract.test.js reconciles hrApi.js against the served surface and
          # fails when they disagree. Without them that guard would not run on the one kind of
          # diff that can break it — a backend-only PR renaming or removing an endpoint — and
          # would only report on the next PR that happened to touch frontend/.
          #
          # docs/api/ is the load-bearing one now. The guard used to parse *Controller.java
          # directly; it now reads docs/api/api-surface.json, which ApiSurfaceContractTest
          # regenerates from springdoc. So a backend-only PR that changes the surface shows up
          # here as a docs/api/ diff, and MUST trigger this job so the new endpoint gets
          # triaged into SERVER_ONLY rather than silently landing unreachable.
          # The Controller.java clause is kept as belt-and-braces: it costs one CI run and
          # catches the case where someone edits a controller without regenerating the digest.
          # .github/scripts/ is the test picker: a change to it must run this suite too.
          # backend/src/main/java/ as a whole (not only controllers) because a handful of
          # frontend tests parse backend Java files through fs — stageCatalog.test.js reads
          # DealStage.java — and a backend-only PR would otherwise never run them. The picker
          # narrows this to the tests that actually mention the changed file.
          if echo "$CHANGED" | grep -qE '^(frontend/|docs/api/|backend/src/main/java/|\.github/workflows/frontend-ci\.yml$|\.github/scripts/)'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi
          # Handed to the selection step below; empty means "unresolvable → full".
          echo "base=$BASE" >> "$GITHUB_OUTPUT"

      - name: No frontend changes — nothing to lint or build
        if: steps.changes.outputs.frontend != 'true'
        run: echo "::notice::No frontend/** changes in this diff; skipping lint, tests and build."

      - name: Set up Node.js 22
        if: steps.changes.outputs.frontend == 'true'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.changes.outputs.frontend == 'true'
        run: npm ci

      - name: Lint (ESLint + jsx-a11y)
        if: steps.changes.outputs.frontend == 'true'
        run: npm run lint

      # F4: the picker's own unit tests run every time the picker is about to decide anything.
      # They are cheap (<1s) and cannot be skipped by a green mode because they run BEFORE it.
      - name: Test the test picker
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ${{ github.workspace }}
        run: node --test '.github/scripts/**/*.test.mjs'

      # See the header comment for the three modes. Runs from the repo root because the
      # picker resolves paths relative to it; the paths it emits are relative to frontend/.
      # Three layers of fail-safe, as in backend-ci: picker exception → full; picker cannot
      # start → full; unknown mode → full (F3).
      - name: Select frontend tests
        id: select
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ${{ github.workspace }}
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE: ${{ steps.changes.outputs.base }}
          BASE_REF: ${{ github.base_ref }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          SELECTION="$RUNNER_TEMP/frontend-selection.txt"
          if [ -z "$BASE" ]; then
            printf 'mode=full\nreason=base commit unresolvable — running the full frontend suite\nextra_test_files=\n' > "$SELECTION"
          elif ! node .github/scripts/select-tests.mjs --side frontend --base "$BASE" --base-ref "$BASE_REF" \
                 --event "$EVENT_NAME" --labels "$PR_LABELS" > "$SELECTION"; then
            printf 'mode=full\nreason=select-tests.mjs could not run — falling back to the full frontend suite\nextra_test_files=\n' > "$SELECTION"
          fi
          MODE="$(sed -n 's/^mode=//p' "$SELECTION")"
          case "$MODE" in
            full|changed|none) ;;
            *)
              echo "::warning title=Unknown frontend test mode::picker printed mode='$MODE' — running the full suite."
              printf 'mode=full\nreason=picker printed an unknown mode (%s) — running the full frontend suite\nextra_test_files=\n' "$MODE" > "$SELECTION"
              MODE=full
              ;;
          esac
          echo "── frontend test selection ──"
          cat "$SELECTION"
          cat "$SELECTION" >> "$GITHUB_OUTPUT"
          REASON="$(sed -n 's/^reason=//p' "$SELECTION")"
          echo "::notice title=Frontend tests: $MODE::$REASON"

      # Gated on "not changed and not none" rather than "== full" so that an empty or
      # unexpected mode — should the validation above ever be bypassed — still runs everything.
      - name: Test (Vitest, full suite)
        if: steps.changes.outputs.frontend == 'true' && steps.select.outputs.mode != 'changed' && steps.select.outputs.mode != 'none'
        run: npm test

      # Two invocations, deliberately: `vitest run --changed BASE file...` treats the files as
      # a filter ON the changed set (it found nothing when tried), so the fs-reading tests and
      # the server-contract guard get their own run. An empty `--changed` set exits 0 with
      # "No test files found", which is the correct verdict for, say, a docs/api-only PR.
      - name: Test (Vitest, changed + fs-reading tests)
        if: steps.changes.outputs.frontend == 'true' && steps.select.outputs.mode == 'changed'
        env:
          BASE: ${{ steps.changes.outputs.base }}
          EXTRA_TEST_FILES: ${{ steps.select.outputs.extra_test_files }}
        run: |
          set -euo pipefail
          echo "── vitest --changed $BASE ──"
          npx vitest run --changed "$BASE"
          if [ -n "$EXTRA_TEST_FILES" ]; then
            read -r -a EXTRAS <<< "$EXTRA_TEST_FILES"
            echo "── vitest (${#EXTRAS[@]} fs-reading / contract test files) ──"
            npx vitest run "${EXTRAS[@]}"
          fi

      - name: Frontend-adjacent files changed, but none affect tests
        if: steps.changes.outputs.frontend == 'true' && steps.select.outputs.mode == 'none'
        env:
          REASON: ${{ steps.select.outputs.reason }}
        run: echo "::notice::$REASON — skipping Vitest."

      - name: Build
        if: steps.changes.outputs.frontend == 'true'
        run: npm run build
