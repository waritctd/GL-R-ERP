name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Same threshold and scope as `npm audit --audit-level=moderate`, minus the
      # advisories reviewed in frontend/audit-allowlist.json. Each exception carries a
      # reachability argument and a hard reviewBy date, so unfixable-but-unreachable
      # advisories cannot quietly become permanent. Anything new still fails here.
      - name: Audit dependencies
        run: npm run audit

      - name: Lint (ESLint + jsx-a11y)
        run: npm run lint

      - name: Test (Vitest)
        run: npm test

      - name: Build
        run: npm run build
