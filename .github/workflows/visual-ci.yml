name: Visual regression (mock frontend)

# Full-page pixel diff of every main surface at three responsive bands, against the MOCK
# frontend (VITE_USE_MOCKS=true). See frontend/e2e-visual/visual-baseline.spec.js.
#
# WHY THIS EXISTS — the other frontend checks are all green for the defects it catches.
# During the styles.css retirement (#604/#606/#613) four distinct CSS-port failures showed up,
# and `npm run lint`, `npm test` and `npm run build` passed for every one of them:
#
#   1. a ported rule GAINS priority it never had. `.status-badge`'s `display: inline-flex`
#      lost to `.data-row > span > span { display: block }` on specificity; moving it to a
#      Tailwind utility put it in `@layer utilities`, which beats `@layer legacy` regardless
#      of specificity. Badges stopped stretching, row heights changed, /tickets shifted.
#   2. an element LOSES a rule it still needs. `.row-actions`' ≤720px `flex-wrap` rule matches
#      a literal class name; a call site migrated to the <RowActions> component stopped
#      matching it. That one reached main unnoticed and was only found by this harness.
#   3. a rule is deleted and its replacement is NEVER APPLIED. `.request-feed-item` was
#      dropped from a shared selector and its three call sites got no utilities. Even a
#      compiled-CSS check passed — every utility emitted was correct; the defect was in what
#      was removed.
#   4. a MERGE reunites new markup with a deleted class. #608 added inputs writing
#      `className='is-invalid'` while a branch in flight deleted `.is-invalid`.
#
# jsdom has no layout engine, so no amount of vitest can see any of this. This job is the
# only automated check that can.
#
# ── THIS JOB IS A REQUIRED CHECK, WHICH IS WHY IT HAS NO `paths:` FILTER ─────────────────
# It used to filter on `frontend/**`. A required status check that is path-filtered NEVER
# REPORTS on a PR that does not touch those paths, and GitHub then waits for it forever —
# every backend-only, docs-only or workflow-only PR would be permanently unmergeable. The
# filtering is therefore done INSIDE the job (see "Detect frontend changes"), so the check
# always reports: it runs the harness when the frontend moved, and succeeds immediately when
# it did not. Do not "tidy this up" by reintroducing a `paths:` key.
#
# `dependency-review.yml`, the repo's other required check, is bare `on: pull_request:` for
# exactly this reason.
#
# `maxDiffPixelRatio` is 0 in the spec, so this is deliberately unforgiving. If real CI noise
# turns up, add a tolerance there with a measured justification — do not weaken the gate by
# making the job non-required or letting it continue-on-error, which would return it to
# reporting nothing anyone acts on.
#
# ── AN INTENDED UI CHANGE IS NOT NOISE, AND HAS ITS OWN PATH ─────────────────────────────
# A PR that deliberately changes the UI fails this job by construction — the baseline comes
# from the merge base, and nothing here commits baselines. That is right for a CSS port
# (which must change nothing) and wrong for a feature: #615 added a row to OvertimePanel and
# was merged with this check RED, which is the habit that eventually waves a real regression
# through. The sanctioned path is frontend/e2e-visual/accepted-changes.txt — name the
# snapshot against your PR number, with a reason. Everything not named stays at zero.
# Do NOT instead raise the tolerance, add a label that skips the job, or merge red.
#
# This is deliberately the second e2e-shaped job. PR #592 consolidated to one on purpose
# ("one e2e job per PR instead of two"); restoring a second was an explicit owner decision on
# the evidence above. It answers a different question from e2e-real-ci.yml: that one asks
# "does the real backend still honour this?", this one asks "did the pixels move?". Neither
# substitutes for the other, and only e2e-real is evidence about permissions.

on:
  pull_request:

# A newer push to the same PR makes an in-flight run pointless — it is comparing a commit
# nobody will merge. Two full harness passes is the expensive part, so cancel early.
concurrency:
  group: visual-${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  visual:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # fetch-depth: 0 — the baseline is captured from this PR's merge base, which needs real
      # history. A shallow clone cannot resolve it.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Resolved from the two explicit SHAs, never from `HEAD` or `origin/main`. For a
      # pull_request event actions/checkout leaves HEAD on a synthetic MERGE commit, not on the
      # PR head, and remote-tracking refs are not guaranteed to be set up — so both of the
      # obvious spellings are wrong here in a way that would silently baseline the wrong tree.
      - name: Resolve merge base
        id: base
        run: |
          set -euo pipefail
          BASE=$(git merge-base "${{ github.event.pull_request.head.sha }}" "${{ github.event.pull_request.base.sha }}")
          echo "Baseline commit: $BASE"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"

      # The `paths:` filter this replaces — see the header for why it cannot come back.
      # Diffed against the merge base, matching what the harness itself compares.
      - name: Detect frontend changes
        id: changed
        run: |
          set -euo pipefail
          if git diff --name-only "${{ steps.base.outputs.sha }}" "${{ github.event.pull_request.head.sha }}" \
             | grep -qE '^frontend/|^\.github/workflows/visual-ci\.yml$'; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No frontend changes — nothing to pixel-diff."
          fi

      # A branch cut before the harness landed (#604) has no config at its merge base. That is
      # not a failure — there is simply nothing to compare against — so say so once and skip the
      # rest rather than dying inside Playwright with an unrelated-looking error.
      - name: Check the harness exists at the merge base
        id: harness
        if: steps.changed.outputs.frontend == 'true'
        run: |
          set -euo pipefail
          if git cat-file -e "${{ steps.base.outputs.sha }}:frontend/playwright.visual.config.js" 2>/dev/null; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No visual harness at the merge base — this branch predates it. Rebase onto main to get a pixel diff."
          fi

      - name: Set up Node.js 22
        if: steps.harness.outputs.present == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.harness.outputs.present == 'true'
        working-directory: frontend
        run: npm ci

      - name: Install Chromium
        if: steps.harness.outputs.present == 'true'
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # THE BASELINE IS BUILT HERE, NOT COMMITTED. The snapshots are large PNGs of
      # payroll/employee/commission screens and this repo is public, so they are gitignored
      # (see .gitignore). Generating them in-run instead of committing them has two further
      # advantages beyond not shipping binaries:
      #
      #   - it is immune to the date-rollover trap documented in the spec. These screenshots
      #     contain today's date, so a committed baseline would fail every single day after the
      #     one it was captured on. Both captures here happen minutes apart in one job.
      #   - it compares against the MERGE BASE, not the tip of main, so unrelated changes that
      #     landed on main after this branch was cut cannot show up as this PR's diff.
      #
      # Detached checkout of source only. node_modules and the Playwright browser cache are
      # gitignored, so they survive both checkouts and are installed exactly once above.
      #
      # ── THE HARNESS IS THE MEASURING INSTRUMENT, SO IT IS PINNED TO THE PR HEAD ───────
      # The two runs below exist to answer exactly one question: did the APPLICATION's pixels
      # move? That only means anything if everything else is held still. But `git checkout
      # --detach $BASE` rewinds the WHOLE tree, e2e-visual/ included — so a PR that edits the
      # spec measures the base with the old instrument and the head with the new one, and
      # every pixel the harness change is itself responsible for gets reported as an
      # application regression.
      #
      # PR #619 is the worked example. It adds `parkPointer()` so a stale mouse position
      # cannot bake a `:hover` state into a capture; it touches one file, entirely inside
      # e2e-visual/, and no application code whatsoever. The baseline was captured without it
      # (hover highlights present), the head with it (highlights gone), and the job reported
      # five regressions across three viewports and three roles — every one of them the fix
      # working, and every one reproducible on the retry. No threshold can separate that from
      # a real defect, because it is not noise: both captures are faithful pictures of two
      # different harnesses.
      #
      # So the baseline runs the merge base's APPLICATION code through the PR's OWN harness.
      # When the harness is untouched — overwhelmingly the common case — the restore is a
      # no-op. When it is touched, the comparison stays honest instead of indicting the fix.
      #
      # What this gives up is narrow, and was never reliable. A harness change that moves
      # pixels was already indistinguishable from a harness FIX that moves pixels, so the old
      # behaviour was uninterpretable noise rather than signal; and a PR that DELETES an
      # assertion escaped either way, since the head run is what decides which snapshots get
      # compared at all. The one genuine loss: a PR that changes app code AND masks the very
      # thing it broke is now hidden in both captures — though unpinned that surfaced only as
      # one more red nobody could read. What guards the harness in either case is reviewing
      # the e2e-visual/ diff: a small JS file, not a wall of PNGs.
      #
      # Known edge: a PR that adds a new route to the spec AND the page behind it will have
      # the baseline visit that route on a tree where it does not exist yet, and diff loudly.
      # Such a PR genuinely has no baseline to compare against — read the diff images.
      #
      # If the harness moves or is renamed, update the pathspec: `set -e` then fails the step
      # loudly, rather than silently baselining with the wrong instrument.
      - name: Capture baseline at the merge base
        if: steps.harness.outputs.present == 'true'
        working-directory: frontend
        env:
          # Only so a bad accepted-changes.txt entry fails here, at the first run, instead of
          # after the baseline has been captured. Acceptances cannot affect this step's result:
          # --update-snapshots writes rather than compares.
          VISUAL_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git checkout --detach ${{ steps.base.outputs.sha }}
          git checkout ${{ github.event.pull_request.head.sha }} -- e2e-visual playwright.visual.config.js
          if ! git diff --quiet ${{ steps.base.outputs.sha }} ${{ github.event.pull_request.head.sha }} \
               -- e2e-visual playwright.visual.config.js; then
            echo "::notice::This PR changes the visual harness. The baseline was captured with the PR's own harness against the merge base's application code, so the diff isolates application pixels."
          fi
          rm -rf e2e-visual/visual-baseline.spec.js-snapshots
          VISUAL_BASELINE=1 npx playwright test --config playwright.visual.config.js --update-snapshots

      # --force because the step above deliberately left the harness paths ahead of $BASE.
      # It discards tracked-file changes only; the freshly captured baselines are gitignored,
      # so they survive into the comparison exactly as node_modules does.
      #
      # VISUAL_PR_NUMBER switches on frontend/e2e-visual/accepted-changes.txt — the list of
      # snapshots whose change is INTENDED and reviewed, for this PR only. Read that file
      # before touching this. Two things matter here:
      #   - it is passed to BOTH runs, so a malformed or misspelled entry fails at the
      #     baseline step rather than three minutes later;
      #   - entries naming any other PR are ignored, so the variable is what scopes an
      #     acceptance to one PR. Never hardcode it, and never default it.
      - name: Diff the PR head against it
        if: steps.harness.outputs.present == 'true'
        working-directory: frontend
        env:
          VISUAL_PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          git checkout --force --detach ${{ github.event.pull_request.head.sha }}
          VISUAL_BASELINE=1 npx playwright test --config playwright.visual.config.js

      # The diff PNGs are the whole point — a pass/fail count cannot distinguish a real
      # regression from noise, and reading the image is what this harness is for. Retained
      # briefly: they are screenshots of the seeded MOCK demo data (VITE_USE_MOCKS=true), never
      # real employee or payroll records, but there is no reason to keep them around long.
      #
      # `always()`, not `failure()`: a snapshot listed in accepted-changes.txt still produces a
      # -diff.png but no longer fails the job, and that image is the only way a reviewer can
      # check the change is the one that was intended. Uploading only on failure would hide
      # exactly the evidence the accept mechanism depends on. On a clean green run Playwright
      # leaves test-results empty, so `if-no-files-found: ignore` makes this a no-op.
      - name: Upload diff images
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-diff-${{ github.event.pull_request.number }}
          path: frontend/test-results/
          retention-days: 7
          if-no-files-found: ignore
